name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '2.0*'
      - '[0-9]+.*'
  # Manuell startbar (Actions -> Build and Release -> Run workflow).
  # Ohne Tag wird das Release als v<Version aus DiagnoseTool.csproj> erstellt.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Determine release tag
      id: v
      shell: bash
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          TAG="${GITHUB_REF_NAME}"
        else
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' DiagnoseTool.csproj | head -n1)
          TAG="v${VERSION}"
        fi
        echo "Release tag: ${TAG}"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Windows x64
      run: dotnet publish DiagnoseTool.csproj -c Release -r win-x64 -o .\publish\win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true

    - name: Publish Windows arm64
      run: dotnet publish DiagnoseTool.csproj -c Release -r win-arm64 -o .\publish\win-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true

    - name: Prepare Windows Executables
      shell: pwsh
      run: |
        Copy-Item -Path .\publish\win-x64\DiagnoseTool.exe -Destination .\DiagnoseTool-Windows-x64.exe
        Copy-Item -Path .\publish\win-arm64\DiagnoseTool.exe -Destination .\DiagnoseTool-Windows-arm64.exe

    - name: Create Release and Upload Windows Files
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        files: |
          DiagnoseTool-Windows-x64.exe
          DiagnoseTool-Windows-arm64.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    # Je Architektur ein eigener Runner: zwei Publishes nacheinander auf demselben
    # Runner liefen in einen Hänger (osx-x64 nach osx-arm64)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: AppleSilicon
            extra: install-macos.sh
          - arch: x64
            label: Intel
            extra: ''

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build signed App Bundle & DMG (${{ matrix.label }})
      run: |
        chmod +x create_app_bundle.sh
        ./create_app_bundle.sh ${{ matrix.arch }}

    - name: Upload macOS Files to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        files: |
          DiagnoseTool-macOS-${{ matrix.label }}.dmg
          ${{ matrix.extra }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
