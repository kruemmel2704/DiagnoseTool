name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Publish Windows x64
      run: dotnet publish DiagnoseTool.csproj -c Release -r win-x64 -o .\publish\win-x64 --self-contained false -p:PublishSingleFile=true -p:PublishReadyToRun=true

    - name: Publish macOS Intel
      run: dotnet publish DiagnoseTool.csproj -c Release -r osx-x64 -o .\publish\osx-x64 --self-contained false -p:PublishSingleFile=true

    - name: Publish macOS Apple Silicon
      run: dotnet publish DiagnoseTool.csproj -c Release -r osx-arm64 -o .\publish\osx-arm64 --self-contained false -p:PublishSingleFile=true

    - name: Prepare Release Packages
      shell: pwsh
      run: |
        Compress-Archive -Path .\publish\win-x64\* -DestinationPath .\DiagnoseTool-Windows-x64.zip
        Compress-Archive -Path .\publish\osx-x64\* -DestinationPath .\DiagnoseTool-macOS-Intel.zip
        Compress-Archive -Path .\publish\osx-arm64\* -DestinationPath .\DiagnoseTool-macOS-AppleSilicon.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          DiagnoseTool-Windows-x64.zip
          DiagnoseTool-macOS-Intel.zip
          DiagnoseTool-macOS-AppleSilicon.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
